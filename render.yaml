# render.yaml
services:
  - type: web
    name: athleticos-api
    # Stated rather than inherited. An omitted plan takes Render's own default,
    # which is a fact about their spec version rather than about this file, and
    # the lesson of the line below in `databases` is that the value standing
    # next to the key is what bites.
    plan: 0.5c-512mb
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athleticos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
    healthCheckPath: /health

  # Daily weather scan. Same image as the API, different command: it talks to the
  # database directly rather than calling an endpoint, because there is no
  # service-to-service auth scheme to hang an endpoint off.
  #
  # 11:00 UTC is 6am Central, so a breach found in the morning still leaves the day
  # to rebook a space and tell parents. The scan looks three days ahead.
  - type: cron
    name: athleticos-weather-scan
    plan: 0.5c-512mb
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 11 * * *"
    dockerCommand: node dist/jobs/weather-scan.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athleticos-db
          property: connectionString
      # config.ts parses one schema for every entry point, so the job needs a
      # JWT_SECRET to satisfy `z.string().min(32)` even though it never signs or
      # verifies a token - it talks to the database and to api.weather.gov.
      #
      # Generated rather than copied from the API. `fromService` would put the
      # live token-SIGNING key into a second service for no reason beyond
      # passing a schema check, and anything that can read this cron's
      # environment could then mint a valid session for any user.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: WEATHER_MODE
        value: live
      # NWS serves 403 to a generic User-Agent and asks for a contact address.
      - key: NWS_CONTACT_EMAIL
        value: burke@autreymail.com
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        value: https://athleticos-web.onrender.com

  - type: web
    name: athleticos-web
    # No `plan` on purpose: this is a static site, and Render static sites do
    # not take one. The two compute services above state theirs; this is not an
    # omission somebody should come along and complete.
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://athleticos-api.onrender.com

databases:
  - name: athleticos-db
    # NOT `free`. Render's free Postgres expires 30 days after creation, gives
    # 14 more days to upgrade, and then deletes the database and all of its
    # data - and free databases support no backups of any kind, so there is
    # nothing to restore from. Applying this blueprint with `plan: free` would
    # therefore delete a school's live schedule about 44 days later, from a
    # change whose entire purpose is to make that data recoverable.
    #
    # `0.1c-256mb` is the smallest PAID tier and gets point-in-time recovery,
    # which is the whole reason for a dedicated instance. The data is ~9.5 MB.
    # Note the spelling: the API reports legacy names like `basic_4gb` on
    # existing instances, while the blueprint spec documents the current ones
    # (`0.1c-256mb`, `0.5c-1g`, `1c-2g`, ...). Render states elsewhere that
    # legacy names remain valid in blueprints, so this is about using the
    # documented spelling rather than about the old one being rejected - I have
    # not tested that it is.
    plan: 0.1c-256mb

    # Closed to the public internet. Render's blueprint spec is explicit that
    # omitting this field means "Render allows all IPs for a new database (all
    # connections require valid credentials)" - so leaving it out would put a
    # school's schedule, and its student and parent records, one leaked
    # connection string away from anyone on the internet, with no JWT and no
    # application code in the path.
    #
    # Services in the same Render account reach the database over the private
    # internal network regardless of this list, so athleticos-api and
    # athleticos-weather-scan are unaffected.
    #
    # It DOES block psql from a laptop. The existing shared instance carries a
    # single entry described as "Burke workstation (only external client)", and
    # the equivalent belongs here too - but this repository is PUBLIC, and a
    # residential IP tied to a named person does not go in it. Whoever
    # provisions this adds that entry in the Render dashboard.
    #
    # Consequence worth knowing: re-applying this blueprint later will remove a
    # manually added entry, because an explicit list replaces rather than
    # merges. Re-add it after any apply.
    ipAllowList: []
