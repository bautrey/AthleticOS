# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athleticos
      POSTGRES_USER: athleticos
      POSTGRES_PASSWORD: athleticos
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athleticos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://athleticos:athleticos@db:5432/athleticos
      JWT_SECRET: dev-secret-change-in-prod-at-least-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 8000
      # Inside the container, loopback is not reachable through the published port
      # mapping, so the process must bind every interface here. Exposure is
      # controlled below by which host interface the port is published on, not by
      # this. Set explicitly rather than inferred from NODE_ENV.
      HOST: 0.0.0.0
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_URL: http://localhost:3005
      # Blackbaud SKY API — defaults to mock mode. To use live OAuth against Blackbaud,
      # set BLACKBAUD_MODE=live and source BLACKBAUD_APP_SECRET / BLACKBAUD_SUBSCRIPTION_KEY
      # from macOS keychain in your shell before `docker compose up`:
      #   export BLACKBAUD_APP_SECRET=$(security find-generic-password -a burkestudio -s athleticos-blackbaud-app-secret -w)
      #   export BLACKBAUD_SUBSCRIPTION_KEY=$(security find-generic-password -a burkestudio -s athleticos-blackbaud-subscription-key -w)
      BLACKBAUD_MODE: ${BLACKBAUD_MODE:-mock}
      BLACKBAUD_APP_SECRET: ${BLACKBAUD_APP_SECRET:-}
      BLACKBAUD_SUBSCRIPTION_KEY: ${BLACKBAUD_SUBSCRIPTION_KEY:-}
      BLACKBAUD_REDIRECT_URI: ${BLACKBAUD_REDIRECT_URI:-http://localhost:8003/auth/blackbaud/callback}
    ports:
      # Published on loopback only. "8003:8000" publishes on every host interface,
      # which puts the API on the LAN again regardless of what the process binds
      # inside the container. Set BIND_HOST=0.0.0.0 for the rare case of reaching
      # this from a phone, and prefer the tailnet address over the whole LAN.
      - "${BIND_HOST:-127.0.0.1}:8003:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8003
    ports:
      # Same reasoning as the api service above.
      - "${BIND_HOST:-127.0.0.1}:3005:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host --port 3000

volumes:
  postgres_data:
